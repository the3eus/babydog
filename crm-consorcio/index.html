<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>CRM Consorcio</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <header class="topo">
    <div class="topo__marca">CRM Consorcio<span>Prospeccao imobiliaria</span></div>
    <select class="seletor-mes" id="seletor-mes" aria-label="Mes de referencia"></select>
  </header>

  <main class="conteudo">
    <!-- Dashboard -->
    <section class="tela" id="tela-dashboard" aria-label="Dashboard"></section>

    <!-- Fases seguintes -->
    <section class="tela" id="tela-leads" hidden aria-label="Leads"></section>
    <section class="tela" id="tela-config" hidden aria-label="Configuracoes"></section>
  </main>

  <nav class="barra" aria-label="Navegacao principal">
    <button class="barra__item" data-tela="dashboard" aria-current="page">
      <span class="barra__icone" aria-hidden="true">📊</span>Painel
    </button>
    <button class="barra__item" data-tela="leads">
      <span class="barra__icone" aria-hidden="true">👥</span>Leads
    </button>
    <button class="barra__item" data-tela="config">
      <span class="barra__icone" aria-hidden="true">⚙️</span>Ajustes
    </button>
  </nav>

  <dialog class="dialogo" id="dialogo-meta">
    <form method="dialog" id="form-meta">
      <h2>Minhas metas do mes</h2>
      <label class="campo">
        <span>Meta de comissao (R$)</span>
        <input type="number" name="metaComissao" min="0" step="100" inputmode="numeric" required />
      </label>
      <label class="campo">
        <span>Meta de reunioes marcadas</span>
        <input type="number" name="metaReunioes" min="0" step="1" inputmode="numeric" required />
      </label>
      <div class="dialogo__acoes">
        <button type="button" class="botao botao--secundario" data-fechar>Cancelar</button>
        <button type="submit" class="botao">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="js/dados.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
